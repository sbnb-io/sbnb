name: Build reefy firmware (self-hosted)

# Self-hosted multi-flavor firmware build.
#
# Triggers on every push so feature-branch validation works:
# push branch → CI builds artifacts → reefy-deploy --github-run <id>
# pulls them → publish to reefy.dev → OTA test on a dev device →
# merge to main when green.
#
# Output: two deployment artifacts per run, named reefy-{prod,dev},
# each containing the corresponding .efi + .raw. reefy-deploy fetches
# by name based on the YAML's `flavor:` field.
#
# A manual-only debug artifact is also uploaded as
# manual-debug-shell-efi. Its name intentionally does not match
# reefy-<flavor>, so it is not part of the normal dev/prod firmware
# deployment contract.
#
# Coexists with the existing build.yml (hosted ubuntu-large)
# during the rollout period; remove that file once self-hosted is
# proven stable.

on:
  workflow_dispatch:
    inputs:
      e2e_build_identity_salt:
        description: Test-only salt for a distinct build ID with unchanged kernel ABI
        required: false
        default: ''
        type: string
  push:
    paths-ignore:
      - '**/README*.md'
      - 'docs/**'
      - 'scripts/**'
      - 'containers/**'
      - 'images/**'
      - 'misc/**'
      - 'collections/**'
      - 'board/reefy/reefy/tests/**'

permissions:
  contents: read
  packages: write
  # For actions/attest-build-provenance@v2: write attestations to
  # the repo's transparency log. id-token: write is what fetches
  # the OIDC JWT used to sign.
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: [self-hosted, large]
    timeout-minutes: 360
    outputs:
      reefy_build_id: ${{ steps.provider_metadata.outputs.reefy_build_id }}
      kernel_abi_sha256: ${{ steps.provider_metadata.outputs.kernel_abi_sha256 }}
      image_version: ${{ steps.provider_metadata.outputs.image_version }}
    env:
      # Persistent caches in the github-runner Reefy app's
      # buildroot-cache volume. dl/ = source tarballs (~2 GB),
      # ccache = compiler cache, output/ = build tree (host tools,
      # per-package work). Without an out-of-tree output, the build
      # tree lives inside the checkout and gets wiped by every
      # actions/checkout's `clean: true` default.
      BR2_DL_DIR: /buildroot-cache/dl
      BR2_CCACHE_DIR: /buildroot-cache/ccache
      BR_OUTPUT: /buildroot-cache/output
      REEFY_E2E_BUILD_IDENTITY_SALT: ${{ inputs.e2e_build_identity_salt || '' }}

    steps:
      - name: Checkout (with buildroot submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout synthetic artifact fixture module
        uses: actions/checkout@v4
        with:
          repository: reefyai/reefy-artifact-fixtures
          ref: 1e51a8edb8547ce173cf67b5973eb1ff61f88f50
          path: artifact-fixtures

      - name: Checkout AMD provider builder
        uses: actions/checkout@v4
        with:
          repository: reefyai/reefy-amd
          ref: ccaf743c5dd77af5aaab91ee8300d1d5402ee1f9
          path: amd-provider

      - name: Validate E2E build identity salt
        shell: bash
        run: |
          if [ -n "$REEFY_E2E_BUILD_IDENTITY_SALT" ] \
              && [[ ! "$REEFY_E2E_BUILD_IDENTITY_SALT" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            echo "invalid e2e_build_identity_salt"
            exit 1
          fi

      - name: Install buildroot prereqs
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential sed make binutils diffutils gcc g++ \
            bash patch gzip bzip2 perl tar cpio unzip rsync file bc \
            findutils gawk wget python3 git libncurses-dev libssl-dev \
            systemd systemd-boot-efi qemu-utils zip ca-certificates \
            ragel parted dosfstools udev

      - name: Configure
        working-directory: buildroot
        run: make BR2_EXTERNAL=.. O="$BR_OUTPUT" reefy_defconfig

      - name: Refresh linux-firmware package selection
        working-directory: buildroot
        run: make O="$BR_OUTPUT" linux-firmware-dirclean

      - name: Heal stale kernel module cache
        working-directory: buildroot
        run: |
          expected_kernel=$(sed -n 's/^BR2_LINUX_KERNEL_CUSTOM_REPO_VERSION="v\([0-9.]*\)"$/\1/p' ../configs/reefy_defconfig)
          test -n "$expected_kernel" || { echo "could not read pinned kernel version"; exit 1; }

          needs_clean=false
          module_root="$BR_OUTPUT/target/lib/modules"
          module_dir="$module_root/$expected_kernel"

          if [ ! -d "$module_dir" ]; then
            echo "missing module directory: $module_dir"
            needs_clean=true
          fi

          if [ -d "$module_root" ]; then
            module_dirs=$(find "$module_root" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
            if [ "$module_dirs" != "$expected_kernel" ]; then
              echo "module directory mismatch: expected only $expected_kernel, got ${module_dirs:-none}"
              needs_clean=true
            fi
          fi

          for module in r8125 r8126 r8127 r8168; do
            if ! find "$module_dir" -name "${module}.ko*" 2>/dev/null | grep -q .; then
              echo "missing ${module} module under $module_dir"
              needs_clean=true
            fi
          done

          for module in nvidia nvidia-drm nvidia-modeset nvidia-uvm; do
            if ! find "$BR_OUTPUT/reefy-artifacts/nvidia/modules-root/lib/modules/$expected_kernel" \
                -name "${module}.ko*" 2>/dev/null | grep -q .; then
              echo "missing staged provider ${module} module"
              needs_clean=true
            fi
          done

          if [ "$needs_clean" = true ]; then
            # Use Buildroot dirclean targets so package stamp files stay
            # consistent with installed files. Do not delete generated
            # target/lib/modules or images/bzImage by hand: external kernel
            # module packages can keep old install stamps and skip reinstalling.
            make O="$BR_OUTPUT" linux-dirclean
            make O="$BR_OUTPUT" r8125-dirclean r8126-dirclean r8127-dirclean r8168-dirclean
            make O="$BR_OUTPUT" nvidia-open-gpu-dirclean
          else
            echo "kernel module cache is current for $expected_kernel"
          fi

          if [ ! -x "$BR_OUTPUT/reefy-artifacts/nvidia/toolkit/nvidia-ctk" ] \
              || [ ! -x "$BR_OUTPUT/reefy-artifacts/nvidia/toolkit/nvidia-cdi-hook" ]; then
            echo "missing staged NVIDIA Container Toolkit provider inputs"
            make O="$BR_OUTPUT" nvidia-container-toolkit-dirclean
          fi

      - name: Build (post_image.sh loops flavors)
        working-directory: buildroot
        run: make O="$BR_OUTPUT" -j$(nproc)

      - name: Build exact AMD provider modules
        run: |
          expected_kernel=$(sed -n 's/^BR2_LINUX_KERNEL_CUSTOM_REPO_VERSION="v\([0-9.]*\)"$/\1/p' configs/reefy_defconfig)
          test -n "$expected_kernel"
          kernel_build=''
          for candidate in "$BR_OUTPUT"/build/linux-*; do
            test "$(cat "$candidate/include/config/kernel.release" 2>/dev/null || true)" = "$expected_kernel" || continue
            test -z "$kernel_build" || { echo "multiple exact kernel build trees"; exit 1; }
            kernel_build=$candidate
          done
          test -n "$kernel_build"
          driver_url=$(python3 -c 'import json; print(json.load(open("amd-provider/versions.json"))["amd_gpu_driver"]["package_url"])')
          mkdir -p "$BR_OUTPUT/reefy-artifacts/amd"
          curl -fL --retry 3 -o "$BR_OUTPUT/reefy-artifacts/amd/amdgpu-dkms.deb" "$driver_url"
          python3 amd-provider/scripts/build_modules.py \
            --driver-package "$BR_OUTPUT/reefy-artifacts/amd/amdgpu-dkms.deb" \
            --kernel-dir "$kernel_build" \
            --kernel-release "$expected_kernel" \
            --toolchain-prefix "$BR_OUTPUT/host/bin/x86_64-buildroot-linux-gnu-" \
            --output "$BR_OUTPUT/reefy-artifacts/amd/modules-root"

      - name: Verify pinned kernel version
        run: |
          expected_kernel=$(sed -n 's/^BR2_LINUX_KERNEL_CUSTOM_REPO_VERSION="v\([0-9.]*\)"$/\1/p' configs/reefy_defconfig)
          test -n "$expected_kernel" || { echo "could not read pinned kernel version"; exit 1; }
          kernel_release=$(find "$BR_OUTPUT/target/lib/modules" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          test "$kernel_release" = "$expected_kernel" \
            || { echo "expected only kernel $expected_kernel, got ${kernel_release:-none}"; exit 1; }
          module_dir="$BR_OUTPUT/target/lib/modules/$expected_kernel"
          for module in r8125 r8126 r8127 r8168; do
            find "$module_dir" -name "${module}.ko*" | grep -q . \
              || { echo "missing ${module} module under $module_dir"; exit 1; }
          done
          if find "$module_dir" -name 'nvidia*.ko*' | grep -q .; then
            echo "NVIDIA provider modules leaked into the Reefy OS image"
            exit 1
          fi
          if find "$module_dir" -name 'amdgpu.ko*' | grep -q .; then
            echo "in-tree AMD provider module leaked into the Reefy OS image"
            exit 1
          fi
          if find "$module_dir" \
              \( -name 'i915.ko*' -o -name 'xe.ko*' \
                 -o -name 'intel_vpu.ko*' -o -name 'kvmgt.ko*' \) \
              -print -quit | grep -q .; then
            echo "Intel provider modules leaked into the Reefy OS image"
            exit 1
          fi
          for helper in drm_suballoc_helper drm_panel_backlight_quirks; do
            find "$module_dir" -name "${helper}.ko*" | grep -q . \
              || { echo "missing shared DRM helper ${helper}"; exit 1; }
          done
          for path in \
              "$BR_OUTPUT/target/usr/bin/nvidia-smi" \
              "$BR_OUTPUT/target/usr/bin/nvidia-ctk" \
              "$BR_OUTPUT/target/usr/bin/nvidia-cdi-hook" \
              "$BR_OUTPUT/target/lib/firmware/nvidia" \
              "$BR_OUTPUT/target/usr/lib/systemd/system/nvidia-cdi-generate.service"; do
            if [ -e "$path" ]; then
              echo "NVIDIA provider payload leaked into the Reefy OS image: $path"
              exit 1
            fi
          done
          if find "$BR_OUTPUT/target/usr/lib" -maxdepth 1 \
              \( -name 'libnvidia*.so*' -o -name 'libcuda.so*' \
                 -o -name 'libnvcuvid.so*' -o -name 'libnvoptix.so*' \) \
              -print -quit | grep -q .; then
            echo "NVIDIA provider libraries leaked into the Reefy OS image"
            exit 1
          fi
          for path in \
              "$BR_OUTPUT/target/lib/firmware/i915" \
              "$BR_OUTPUT/target/lib/firmware/xe" \
              "$BR_OUTPUT/target/lib/firmware/intel/vpu"; do
            if [ -e "$path" ]; then
              echo "Intel provider firmware leaked into the Reefy OS image: $path"
              exit 1
            fi
          done

      - name: Verify multi-flavor outputs
        run: |
          intel="$BR_OUTPUT/reefy-artifacts/intel"
          for module in i915 xe intel_vpu; do
            find "$intel/modules-root" -name "${module}.ko*" | grep -q . \
              || { echo "missing Intel provider module ${module}"; exit 1; }
          done
          test -f "$intel/firmware-root/lib/firmware/xe/lnl_guc_70.bin" \
            || { echo "missing Intel provider xe/lnl_guc_70.bin"; exit 1; }
          test -f "$intel/firmware-root/lib/firmware/i915/xe2lpd_dmc.bin" \
            || { echo "missing Intel provider i915/xe2lpd_dmc.bin"; exit 1; }
          find "$intel/firmware-root/lib/firmware/intel/vpu" \
            -name 'vpu_*.bin' | grep -q . \
            || { echo "missing Intel provider VPU firmware"; exit 1; }
          du -h "$intel/modules-root" "$intel/firmware-root"
          ls -la "$BR_OUTPUT/images/"
          for flavor in prod dev debug-shell; do
            test -f "$BR_OUTPUT/images/reefy-${flavor}.efi" \
              || { echo "missing reefy-${flavor}.efi"; exit 1; }
            test -f "$BR_OUTPUT/images/reefy-${flavor}.raw" \
              || { echo "missing reefy-${flavor}.raw"; exit 1; }
            du -h "$BR_OUTPUT/images/reefy-${flavor}".{efi,raw}
          done

      # Stage os-release next to the images so it travels with the
      # artifact zip. reefy-deploy reads IMAGE_VERSION from this file
      # (e.g. `2026.04.14-07`) for S3 object naming and latest.json -
      # without it the version label falls back to `gh-run-<id>` which
      # isn't a meaningful release tag.
      - name: Stage os-release alongside images
        run: cp "$BR_OUTPUT/target/usr/lib/os-release" "$BR_OUTPUT/images/os-release"

      - name: Stage exact provider inputs
        id: provider_metadata
        run: |
          os_release="$BR_OUTPUT/target/usr/lib/os-release"
          kernel_release=$(find "$BR_OUTPUT/target/lib/modules" \
            -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          reefy_build_id=$(sed -n 's/^REEFY_BUILD_ID=//p' "$os_release")
          kernel_abi_sha256=$(sed -n 's/^REEFY_KERNEL_ABI_SHA256=//p' "$os_release")
          image_version=$(sed -n 's/^IMAGE_VERSION=//p' "$os_release")
          test -n "$kernel_release"
          test -n "$reefy_build_id"
          test -n "$kernel_abi_sha256"
          test -n "$image_version"

          nvidia="$BR_OUTPUT/reefy-artifacts/nvidia"
          test -x "$nvidia/toolkit/nvidia-ctk"
          test -x "$nvidia/toolkit/nvidia-cdi-hook"
          for module in nvidia nvidia-drm nvidia-modeset nvidia-uvm; do
            find "$nvidia/modules-root/lib/modules/$kernel_release" \
              -name "${module}.ko*" | grep -q . \
              || { echo "missing provider input ${module}"; exit 1; }
          done
          cat > "$nvidia/metadata.env" <<EOF
          KERNEL_RELEASE=$kernel_release
          REEFY_BUILD_ID=$reefy_build_id
          REEFY_KERNEL_ABI_SHA256=$kernel_abi_sha256
          IMAGE_VERSION=$image_version
          EOF

          intel="$BR_OUTPUT/reefy-artifacts/intel"
          for module in i915 xe intel_vpu; do
            find "$intel/modules-root/lib/modules/$kernel_release" \
              -name "${module}.ko*" | grep -q . \
              || { echo "missing Intel provider input ${module}"; exit 1; }
          done
          test -d "$intel/firmware-root/lib/firmware/i915"
          test -d "$intel/firmware-root/lib/firmware/xe"
          test -d "$intel/firmware-root/lib/firmware/intel/vpu"
          cp "$nvidia/metadata.env" "$intel/metadata.env"

          amd="$BR_OUTPUT/reefy-artifacts/amd"
          for module in amdgpu amdkcl amdxcp amdttm amd-sched \
              amddrm_ttm_helper amddrm_buddy amddrm_exec; do
            find "$amd/modules-root/lib/modules/$kernel_release" \
              -name "${module}.ko" | grep -q . \
              || { echo "missing AMD provider input ${module}"; exit 1; }
          done
          if find "$amd/modules-root" -name 'amddrm_suballoc_helper.ko' \
              | grep -q .; then
            echo "conflicting AMD suballocator helper was staged"
            exit 1
          fi
          cp "$nvidia/metadata.env" "$amd/metadata.env"

          fixture="$BR_OUTPUT/reefy-artifacts/fixture"
          mkdir -p "$fixture"
          cp "$nvidia/metadata.env" "$fixture/metadata.env"
          kernel_build=''
          for candidate in "$BR_OUTPUT"/build/linux-*; do
            test "$(cat "$candidate/include/config/kernel.release" 2>/dev/null || true)" = "$kernel_release" || continue
            test -z "$kernel_build" || { echo "multiple exact kernel build trees"; exit 1; }
            kernel_build=$candidate
          done
          test -n "$kernel_build"
          make -C "$kernel_build" \
            ARCH=x86 \
            CROSS_COMPILE="$BR_OUTPUT/host/bin/x86_64-buildroot-linux-gnu-" \
            M="$GITHUB_WORKSPACE/artifact-fixtures/module" modules
          cp "$GITHUB_WORKSPACE/artifact-fixtures/module/reefy_e2e_artifact.ko" \
            "$fixture/reefy_e2e_artifact.ko"

          echo "reefy_build_id=$reefy_build_id" >> "$GITHUB_OUTPUT"
          echo "kernel_abi_sha256=$kernel_abi_sha256" >> "$GITHUB_OUTPUT"
          echo "image_version=$image_version" >> "$GITHUB_OUTPUT"

      - name: Upload NVIDIA provider inputs
        uses: actions/upload-artifact@v4
        with:
          name: reefy-nvidia-inputs
          compression-level: 1
          path: |
            ${{ env.BR_OUTPUT }}/reefy-artifacts/nvidia/modules-root
            ${{ env.BR_OUTPUT }}/reefy-artifacts/nvidia/toolkit
            ${{ env.BR_OUTPUT }}/reefy-artifacts/nvidia/metadata.env

      - name: Upload Intel provider inputs
        uses: actions/upload-artifact@v4
        with:
          name: reefy-intel-inputs
          compression-level: 1
          path: |
            ${{ env.BR_OUTPUT }}/reefy-artifacts/intel/modules-root
            ${{ env.BR_OUTPUT }}/reefy-artifacts/intel/firmware-root
            ${{ env.BR_OUTPUT }}/reefy-artifacts/intel/metadata.env

      - name: Upload AMD provider inputs
        uses: actions/upload-artifact@v4
        with:
          name: reefy-amd-inputs
          compression-level: 1
          path: |
            ${{ env.BR_OUTPUT }}/reefy-artifacts/amd/modules-root
            ${{ env.BR_OUTPUT }}/reefy-artifacts/amd/metadata.env

      - name: Upload synthetic artifact fixture inputs
        uses: actions/upload-artifact@v4
        with:
          name: reefy-artifact-fixture-inputs
          path: |
            ${{ env.BR_OUTPUT }}/reefy-artifacts/fixture/metadata.env
            ${{ env.BR_OUTPUT }}/reefy-artifacts/fixture/reefy_e2e_artifact.ko

      # Per-flavor artifact upload. Naming convention `reefy-<flavor>`
      # is the contract reefy-deploy queries against
      # (`gh api .../actions/artifacts?name=reefy-prod`). Don't
      # rename without also updating tools/reefy-deploy/steps/firmware.py.
      - name: Upload reefy-prod artifact
        uses: actions/upload-artifact@v4
        with:
          name: reefy-prod
          # Level 1 vs default 6: ~5% size diff on already-compressed
          # squashfs payloads but ~6x faster CPU.
          compression-level: 1
          path: |
            ${{ env.BR_OUTPUT }}/images/reefy-prod.efi
            ${{ env.BR_OUTPUT }}/images/reefy-prod.raw
            ${{ env.BR_OUTPUT }}/images/os-release

      - name: Upload reefy-dev artifact
        uses: actions/upload-artifact@v4
        with:
          name: reefy-dev
          compression-level: 1
          path: |
            ${{ env.BR_OUTPUT }}/images/reefy-dev.efi
            ${{ env.BR_OUTPUT }}/images/reefy-dev.raw
            ${{ env.BR_OUTPUT }}/images/os-release

      # Manual-only debug EFI for bench investigation. Deliberately not named
      # `reefy-debug-shell`, because reefy-deploy resolves deployment artifacts
      # by the `reefy-<flavor>` naming convention.
      - name: Upload manual debug shell EFI artifact
        uses: actions/upload-artifact@v4
        with:
          name: manual-debug-shell-efi
          compression-level: 1
          path: |
            ${{ env.BR_OUTPUT }}/images/reefy-debug-shell.efi
            ${{ env.BR_OUTPUT }}/images/os-release

      # Layer A from PLAN-firmware-via-artifacts.md: SLSA build
      # provenance attestation, signed by Sigstore via OIDC, recorded
      # in the public Rekor log. Lets reefy-deploy verify
      # `gh attestation verify` before publishing to S3, defending
      # against post-build artifact substitution by anyone with
      # actions:write.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ env.BR_OUTPUT }}/images/reefy-prod.efi
            ${{ env.BR_OUTPUT }}/images/reefy-prod.raw
            ${{ env.BR_OUTPUT }}/images/reefy-dev.efi
            ${{ env.BR_OUTPUT }}/images/reefy-dev.raw

  publish-nvidia-provider:
    needs: build
    uses: reefyai/reefy-nvidia/.github/workflows/publish.yml@bae37235695f797f86c05efc06daa0b927752a19
    with:
      input_artifact: reefy-nvidia-inputs
    secrets: inherit

  publish-intel-provider:
    needs: build
    uses: reefyai/reefy-intel/.github/workflows/publish.yml@03b2e8fbaab93a7523613b08d237737e50a5e5ad
    with:
      input_artifact: reefy-intel-inputs
    secrets: inherit

  publish-amd-provider:
    needs: build
    uses: reefyai/reefy-amd/.github/workflows/publish.yml@ccaf743c5dd77af5aaab91ee8300d1d5402ee1f9
    with:
      input_artifact: reefy-amd-inputs
    secrets: inherit

  publish-artifact-fixture:
    needs: build
    uses: reefyai/reefy-artifact-fixtures/.github/workflows/publish.yml@1e51a8edb8547ce173cf67b5973eb1ff61f88f50
    with:
      input_artifact: reefy-artifact-fixture-inputs
    secrets: inherit

  provider-catalog:
    needs: [build, publish-nvidia-provider, publish-amd-provider, publish-intel-provider, publish-artifact-fixture]
    runs-on: ubuntu-24.04
    steps:
      - name: Build exact provider catalog
        env:
          REEFY_BUILD_ID: ${{ needs.build.outputs.reefy_build_id }}
          KERNEL_ABI_SHA256: ${{ needs.build.outputs.kernel_abi_sha256 }}
          IMAGE_VERSION: ${{ needs.build.outputs.image_version }}
          NVIDIA_DIGEST: ${{ needs.publish-nvidia-provider.outputs.digest }}
          AMD_DIGEST: ${{ needs.publish-amd-provider.outputs.digest }}
          INTEL_DIGEST: ${{ needs.publish-intel-provider.outputs.digest }}
          FIXTURE_DIGEST: ${{ needs.publish-artifact-fixture.outputs.digest }}
          FIXTURE_WRONG_ABI_DIGEST: ${{ needs.publish-artifact-fixture.outputs.wrong_abi_digest }}
          FIXTURE_MISSING_HOOK_DIGEST: ${{ needs.publish-artifact-fixture.outputs.missing_hook_digest }}
          FIXTURE_FAILING_HOOK_DIGEST: ${{ needs.publish-artifact-fixture.outputs.failing_hook_digest }}
          FIXTURE_APP_DIGESTS: ${{ needs.publish-artifact-fixture.outputs.app_digests }}
        run: |
          fixture_app_1=$(printf '%s' "$FIXTURE_APP_DIGESTS" | cut -d, -f1)
          fixture_app_2=$(printf '%s' "$FIXTURE_APP_DIGESTS" | cut -d, -f2)
          fixture_app_3=$(printf '%s' "$FIXTURE_APP_DIGESTS" | cut -d, -f3)
          fixture_app_4=$(printf '%s' "$FIXTURE_APP_DIGESTS" | cut -d, -f4)
          for digest in "$fixture_app_1" "$fixture_app_2" \
              "$fixture_app_3" "$fixture_app_4"; do
            test -n "$digest"
          done
          jq -n \
            --arg build_id "$REEFY_BUILD_ID" \
            --arg abi "sha256:$KERNEL_ABI_SHA256" \
            --arg image_version "$IMAGE_VERSION" \
            --arg nvidia "ghcr.io/reefyai/reefy-nvidia@$NVIDIA_DIGEST" \
            --arg amd "ghcr.io/reefyai/reefy-amd@$AMD_DIGEST" \
            --arg intel "ghcr.io/reefyai/reefy-intel@$INTEL_DIGEST" \
            --arg fixture "ghcr.io/reefyai/reefy-artifact-fixtures@$FIXTURE_DIGEST" \
            --arg fixture_wrong_abi "ghcr.io/reefyai/reefy-artifact-fixtures@$FIXTURE_WRONG_ABI_DIGEST" \
            --arg fixture_missing_hook "ghcr.io/reefyai/reefy-artifact-fixtures@$FIXTURE_MISSING_HOOK_DIGEST" \
            --arg fixture_failing_hook "ghcr.io/reefyai/reefy-artifact-fixtures@$FIXTURE_FAILING_HOOK_DIGEST" \
            --arg fixture_app_1 "ghcr.io/reefyai/reefy-artifact-fixtures@$fixture_app_1" \
            --arg fixture_app_2 "ghcr.io/reefyai/reefy-artifact-fixtures@$fixture_app_2" \
            --arg fixture_app_3 "ghcr.io/reefyai/reefy-artifact-fixtures@$fixture_app_3" \
            --arg fixture_app_4 "ghcr.io/reefyai/reefy-artifact-fixtures@$fixture_app_4" \
            '{schema_version: 1,
              reefy_build_id: $build_id,
              kernel_abi_digest: $abi,
              image_version: $image_version,
              providers: {
                "nvidia-driver": {ref: $nvidia},
                "amd-driver": {ref: $amd},
                "intel-accelerator": {ref: $intel}
              },
              fixtures: {
                "e2e-host-extension": {ref: $fixture},
                "e2e-wrong-abi": {ref: $fixture_wrong_abi},
                "e2e-missing-hook": {ref: $fixture_missing_hook},
                "e2e-failing-hook": {ref: $fixture_failing_hook},
                "e2e-app-1": {ref: $fixture_app_1},
                "e2e-app-2": {ref: $fixture_app_2},
                "e2e-app-3": {ref: $fixture_app_3},
