[Unit]
# Hold the docker daemon (and its restart:unless-stopped container
# restore) until per-app volumes are mounted, closing the boot
# mount-race. Wants= (not Requires=) so a timed-out/failed volume mount
# degrades to "docker starts anyway" + reconciler self-heal, instead of
# bricking the app layer. reefy-mqtt is deliberately NOT ordered after
# this - the MQTT/control path must stay up even if app volumes are
# wedged.
After=reefy-app-volumes.service
Wants=reefy-app-volumes.service
