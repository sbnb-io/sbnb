# Per-app SSH access on the device. Routes `ssh app-<name>@host` into
# the right container via reefy-app-shell, reusing the same authorized
# keys file as the `reefy` user (single source of truth).
#
# Companion: reefy_reconciler creates / removes `app-<name>` system
# users to mirror desired-state.instances. The shell script in
# ForceCommand maps the username back to a docker container and execs
# bash inside it - no sshd in the app image.
#
# Forwarding intentionally disabled FOR app-* users only. SSH `-L`/`-X`/
# `-A` would terminate at the host (where sshd runs), not inside the app
# container - misleading. Users who need host-side forwarding should ssh
# as `reefy@host` instead, which keeps OpenSSH defaults (TCP + agent fwd
# enabled).
#
# AuthorizedKeysFile lives at /etc/ssh/authorized_keys.d/reefy (root:root
# 0644) so sshd can read it after dropping privs to *any* user (the
# `app-<name>` users have no access to /home/reefy/.ssh). Both reefy and
# app-* share this file - keys added in the dashboard grant access to
# all app shells in one go. Reconciler is the only writer.

AuthorizedKeysFile /etc/ssh/authorized_keys.d/reefy

Match User app-*
    ForceCommand /usr/bin/reefy-app-shell
    PermitTTY yes
    PasswordAuthentication no
    PermitEmptyPasswords no
    AllowTcpForwarding no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTunnel no
    GatewayPorts no
